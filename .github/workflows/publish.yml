name: Publish

# A published GitHub release puts that version on npm. npm trusts this
# workflow file through trusted publishing, so no token is stored anywhere,
# and the package carries a provenance statement linking it to this run.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The release tag names the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - name: The public surface is up to date
        run: npm run generate && git diff --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Builds first (prepack), then publishes through trusted publishing.
      - run: npm publish
